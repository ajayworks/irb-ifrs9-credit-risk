# Margin of conservatism framework.
# Reference: EBA/GL/2017/16, as consolidated into PRA SS4/24.
#
# MoC applies to REGULATORY estimates only. It must NOT be applied to IFRS 9
# parameters, which are required to be unbiased.
#
# Each item states the deficiency, the direction of any bias, how it is quantified,
# and the resulting add-on. MoC is required only where an estimate may be UNDERSTATED:
# a deficiency that can only overstate the estimate is assessed and recorded, with a
# zero add-on.
#
# status:
#   quantified             add_on_pd computed (category C is computed by the code)
#   assessed_conservative  bias can only overstate PD - zero add-on, reason recorded
#   pending                could understate PD; quantification not yet done. Listed in
#                          every calibration output until resolved - never silently zero.
#
# PD add-ons are absolute (e.g. 0.0005 = +0.05 percentage points), per grade.

categories:

  A1:
    name: "Data deficiencies"
    items:
      - id: A1.1
        deficiency: "Delinquency reported in 30-day buckets; the exact 90th day is not observable"
        direction: "Could understate: recognition can lag by up to a month, moving some defaults past the 12-month window"
        quantification: "Upper bound: re-estimate one-year default rates with a 13-month window"
        applies_to: pd
        add_on_pd: null
        status: pending
      - id: A1.2
        deficiency: "Materiality thresholds not observable - arrears amounts are not reported"
        direction: "Can only overstate: immaterial arrears are counted as default"
        quantification: "None required"
        applies_to: pd
        add_on_pd: 0.0
        status: assessed_conservative
      - id: A1.3
        deficiency: "Incomplete workouts excluded from the LGD reference data set"
        direction: "Understates LGD (long workouts are the bad ones)"
        quantification: "Difference between LGD with and without modelled open cases"
        applies_to: lgd
        add_on_lgd: null
        status: pending

  A2:
    name: "Methodological deficiencies"
    items:
      - id: A2.1
        deficiency: "Unlikeliness to pay proxied by disposition codes; distressed restructurings without 90 DPD are not treated as default"
        direction: "Could understate: under EBA/GL/2016/07 a distressed restructuring with an NPV loss above 1% is itself a default"
        quantification: "Upper bound: DoD variant treating every modification of a performing loan as default"
        applies_to: pd
        add_on_pd: null
        status: pending
      - id: A2.2
        deficiency: "LGD discount rate is a judgement with material sensitivity"
        direction: "Understates LGD if the rate is set too low"
        quantification: "LGD at the upper end of the plausible discount rate range"
        applies_to: lgd
        add_on_lgd: null
        status: pending

  B:
    name: "Relevant changes in underwriting, risk appetite, collection policy"
    items:
      - id: B.1
        deficiency: "Post-2008 underwriting tightened materially; pre-crisis vintages weigh heavily in the long-run average"
        direction: "Can only overstate PD for today's book"
        quantification: "None required"
        applies_to: pd
        add_on_pd: 0.0
        status: assessed_conservative
      - id: B.2
        deficiency: "Arrears accrued under forbearance do not count toward 90 DPD (baseline definition of default)"
        direction: "Could understate: 2020-21 defaults are fewer than under a count-everything definition"
        quantification: "Grade-level long-run average under the forbearance_dpd_counts DoD variant, minus baseline"
        applies_to: pd
        add_on_pd: null
        status: pending

  C:
    name: "General estimation error"
    items:
      - id: C.1
        deficiency: "Statistical uncertainty in the long-run average default rate per grade"
        direction: "Symmetric; conservatism requires the upper end"
        quantification: "Bootstrap the years; add-on = chosen percentile minus the estimate"
        applies_to: pd
        bootstrap:
          n_resamples: 2000
          percentile: 0.75
          block_years: 1          # resample whole years: keeps within-year correlation
          seed: 20260929
        add_on_pd: computed
        status: quantified

application:
  # Add-ons are summed; summing independent uncertainties is conservative. MoC is added
  # before the regulatory floor, and both are reported.
  method: additive
  apply_before_floor: true
